<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repositorio de Vocabulario</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8f9fa; margin: 0; padding: 20px; color: #333; }
    
    .container { max-width: 1400px; margin: 0 auto; }
    
    /* Panel de controles y formulario */
    .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .form-grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 15px; }
    .form-grid input, .form-grid select { flex: 1; min-width: 150px; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; }
    
    /* Pestañas */
    .tabs { display: flex; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }
    .tab-btn { padding: 8px 16px; border: none; background: transparent; font-weight: bold; cursor: pointer; color: #6b7280; border-radius: 6px; }
    .tab-btn.active { background: #4f46e5; color: white; }

    /* Botones */
    .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-success { background: #10b981; color: white; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Zona Dumper Drag & Drop */
    .drop-zone { border: 2px dashed #4f46e5; border-radius: 10px; padding: 25px; text-align: center; background: #eef2ff; color: #4f46e5; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .drop-zone:hover { background: #e0e7ff; }

    /* Tabla Dumper */
    .dumper-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .dumper-table th, .dumper-table td { padding: 10px; border: 1px solid #e5e7eb; text-align: left; }
    .dumper-table th { background: #f3f4f6; }
    .dumper-table img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
    .dumper-table input, .dumper-table select { width: 100%; padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; }

    /* Filtro de Abecedario (A-Z) */
    .alphabet-filter { display: flex; flex-wrap: wrap; gap: 5px; margin: 15px 0; }
    .letter-btn { padding: 6px 12px; border: 1px solid #e5e7eb; background: white; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
    .letter-btn.active, .letter-btn:hover { background: #4f46e5; color: white; border-color: #4f46e5; }

    /* Grid de tarjetas */
    .words-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; margin-top: 20px; }
    
    /* Tarjetas de palabras */
    .card { background: white; border-radius: 10px; padding: 12px; text-align: center; border: 2px solid #e5e7eb; position: relative; cursor: pointer; user-select: none; transition: transform 0.1s, border-color 0.2s; }
    .card:hover { transform: translateY(-3px); }
    .card.selected { border-color: #10b981; background-color: #ecfdf5; }
    .card img { width: 100%; height: 130px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
    .card-title { font-weight: bold; font-size: 1.1rem; margin: 5px 0 2px 0; }
    .card-sub { font-size: 0.85rem; color: #4f46e5; font-weight: 600; }
    .card-tags { font-size: 0.78rem; color: #6b7280; font-style: italic; margin-top: 3px; }
    .checkbox-custom { position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; cursor: pointer; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

  <div class="container">
    <h1>📚 Repositorio de Vocabulario</h1>

    <!-- Panel de Subida con Pestañas -->
    <div class="panel">
      <div class="tabs">
        <button class="tab-btn active" id="tabSingleBtn" onclick="switchTab('single')">Subir Una Palabra</button>
        <button class="tab-btn" id="tabDumperBtn" onclick="switchTab('dumper')">⚡ Carga Masiva (Dumper)</button>
      </div>

      <!-- Formulario Individual -->
      <div id="singleUploadView">
        <form id="uploadForm">
          <div class="form-grid">
            <input type="text" id="word" placeholder="Palabra en inglés (ej: Bat)" required>
            <input type="text" id="translation" placeholder="Traducción (ej: murcielago)">
            <input type="text" id="context" placeholder="Contexto (ej: animal)">
            <select id="partOfSpeech">
              <option value="">Categoría (Opcional)</option>
              <option value="noun">Noun (Sustantivo)</option>
              <option value="verb">Verb (Verbo)</option>
              <option value="adj">Adjective (Adjetivo)</option>
              <option value="adv">Adverb (Adverbio)</option>
            </select>
            <input type="file" id="image" accept="image/*" required>
          </div>
          <button type="submit" class="btn btn-primary">Guardar en catálogo</button>
        </form>
      </div>

      <!-- Carga Masiva Dumper -->
      <div id="dumperView" style="display: none;">
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('dumperFileInput').click()">
          📂 Arrastra aquí tus imágenes o haz clic para seleccionar varias a la vez
          <input type="file" id="dumperFileInput" accept="image/*" multiple style="display: none;">
        </div>

        <div id="dumperTableContainer" style="display: none; margin-top: 15px;">
          <table class="dumper-table">
            <thead>
              <tr>
                <th>Vista Previa</th>
                <th>Palabra (Inglés)</th>
                <th>Traducción</th>
                <th>Contexto</th>
                <th>Categoría</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="dumperTbody"></tbody>
          </table>
          <div style="margin-top: 15px; text-align: right;">
            <button class="btn btn-success" id="saveDumperBatchBtn" onclick="saveDumperBatch()">💾 Guardar todas en lote</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Controles de Filtro y Descarga -->
    <div class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <input type="text" id="searchInput" placeholder="🔍 Buscar por palabra o traducción..." style="padding: 8px 12px; width: 250px; border-radius: 6px; border: 1px solid #ccc;">
          
          <select id="categoryFilter" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; background: white;">
            <option value="ALL">Todas las categorías</option>
            <option value="noun">Noun (Sustantivo)</option>
            <option value="verb">Verb (Verbo)</option>
            <option value="adj">Adjective (Adjetivo)</option>
            <option value="adv">Adverb (Adverbio)</option>
          </select>
        </div>

        <div>
          <button id="selectAllBtn" class="btn btn-secondary">Seleccionar visibles</button>
          <button id="downloadZipBtn" class="btn btn-success" disabled>Descargar ZIP (0)</button>
        </div>
      </div>

      <!-- Menú A-Z -->
      <div class="alphabet-filter" id="alphabetBar">
        <button class="letter-btn active" id="btnAll">TODAS</button>
      </div>
    </div>

    <!-- Rejilla de Imágenes -->
    <div class="words-grid" id="wordsGrid"></div>
  </div>

  <script>
    let allWords = [];
    const selectedWords = new Map();
    let currentLetterFilter = 'ALL';
    let dumperFiles = [];

    // Cambiar pestañas
    function switchTab(tab) {
      document.getElementById('singleUploadView').style.display = tab === 'single' ? 'block' : 'none';
      document.getElementById('dumperView').style.display = tab === 'dumper' ? 'block' : 'none';
      document.getElementById('tabSingleBtn').classList.toggle('active', tab === 'single');
      document.getElementById('tabDumperBtn').classList.toggle('active', tab === 'dumper');
    }

    // Inicializar abecedario
    function initAlphabet() {
      const alphabetBar = document.getElementById('alphabetBar');
      const btnAll = document.getElementById('btnAll');

      if (btnAll) {
        btnAll.addEventListener('click', () => filterByLetter('ALL', btnAll));
      }

      for (let i = 65; i <= 90; i++) {
        const letter = String.fromCharCode(i);
        const btn = document.createElement('button');
        btn.className = 'letter-btn';
        btn.textContent = letter;
        btn.addEventListener('click', () => filterByLetter(letter, btn));
        alphabetBar.appendChild(btn);
      }
    }

    // Lógica Dumper (Drag & Drop y Procesamiento)
    const dropZone = document.getElementById('dropZone');
    const dumperFileInput = document.getElementById('dumperFileInput');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
    });

    dropZone.addEventListener('drop', (e) => handleFiles(e.dataTransfer.files));
    dumperFileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    function handleFiles(files) {
      const arrayFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
      if (arrayFiles.length === 0) return;

      dumperFiles = arrayFiles.map(file => {
        // Extraer nombre básico sin extensión
        const nameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
        
        // Separar si viene con guion bajo o medio (ej: dog_perro o dog-perro)
        const parts = nameWithoutExt.split(/[-_]/);
        const rawWord = parts[0] ? parts[0].trim() : nameWithoutExt;
        const rawTrans = parts[1] ? parts[1].trim() : '';

        return {
          file: file,
          previewUrl: URL.createObjectURL(file),
          word: rawWord.charAt(0).toUpperCase() + rawWord.slice(1),
          translation: rawTrans ? rawTrans.charAt(0).toUpperCase() + rawTrans.slice(1) : '',
          context: '',
          part_of_speech: ''
        };
      });

      renderDumperTable();
    }

    function renderDumperTable() {
      const tbody = document.getElementById('dumperTbody');
      tbody.innerHTML = '';

      dumperFiles.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><img src="${item.previewUrl}" alt="Preview"></td>
          <td><input type="text" value="${item.word}" oninput="dumperFiles[${index}].word = this.value"></td>
          <td><input type="text" value="${item.translation}" oninput="dumperFiles[${index}].translation = this.value"></td>
          <td><input type="text" value="${item.context}" placeholder="ej: casa" oninput="dumperFiles[${index}].context = this.value"></td>
          <td>
            <select onchange="dumperFiles[${index}].part_of_speech = this.value">
              <option value="">Opcional</option>
              <option value="noun" ${item.part_of_speech === 'noun' ? 'selected' : ''}>Noun</option>
              <option value="verb" ${item.part_of_speech === 'verb' ? 'selected' : ''}>Verb</option>
              <option value="adj" ${item.part_of_speech === 'adj' ? 'selected' : ''}>Adjective</option>
              <option value="adv" ${item.part_of_speech === 'adv' ? 'selected' : ''}>Adverb</option>
            </select>
          </td>
          <td><button class="btn" style="background:#ff4d4d; color:white; padding: 4px 8px;" onclick="removeDumperItem(${index})">&times;</button></td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('dumperTableContainer').style.display = dumperFiles.length > 0 ? 'block' : 'none';
    }

    function removeDumperItem(index) {
      dumperFiles.splice(index, 1);
      renderDumperTable();
    }

    async function saveDumperBatch() {
      const btn = document.getElementById('saveDumperBatchBtn');
      btn.disabled = true;
      btn.textContent = 'Guardando Lote...';

      for (const item of dumperFiles) {
        if (!item.word.trim()) continue;

        const formData = new FormData();
        formData.append('word', item.word);
        formData.append('translation', item.translation);
        formData.append('context', item.context);
        formData.append('part_of_speech', item.part_of_speech);
        formData.append('image', item.file);

        try {
          await fetch('/api/words-with-image', { method: 'POST', body: formData });
        } catch (err) {
          console.error('Error al guardar palabra:', item.word, err);
        }
      }

      dumperFiles = [];
      renderDumperTable();
      btn.disabled = false;
      btn.textContent = '💾 Guardar todas en lote';
      switchTab('single');
      cargarPalabras();
    }

    // Cargar palabras
    async function cargarPalabras() {
      try {
        const res = await fetch('/api/words');
        const data = await res.json();

        if (!res.ok || !Array.isArray(data)) {
          console.error('Error al cargar palabras:', data);
          allWords = [];
          renderGrid();
          return;
        }

        allWords = data;
        allWords.sort((a, b) => a.word.localeCompare(b.word));
        renderGrid();
      } catch (err) {
        console.error('Error de red al conectar con /api/words:', err);
      }
    }

    function sanitize(str) {
      if (!str) return '';
      return str.toLowerCase().trim().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
    }

    // Renderizar tarjetas con triple filtro
    function renderGrid() {
      const grid = document.getElementById('wordsGrid');
      const searchSearch = document.getElementById('searchInput').value.toLowerCase();
      const selectedCategory = document.getElementById('categoryFilter').value.toLowerCase();
      grid.innerHTML = '';

      const filtered = allWords.filter(item => {
        const matchesLetter = currentLetterFilter === 'ALL' || item.word.toUpperCase().startsWith(currentLetterFilter);
        const matchesSearch = item.word.toLowerCase().includes(searchSearch) || (item.translation && item.translation.toLowerCase().includes(searchSearch));
        
        const itemCategory = (item.part_of_speech || item.category || '').toLowerCase();
        const matchesCategory = selectedCategory === 'all' || itemCategory === selectedCategory;

        return matchesLetter && matchesSearch && matchesCategory;
      });

      filtered.forEach(item => {
        const ext = (item.image_url || '').split('.').pop().split('?')[0] || 'jpg';
        
        const parts = [
          sanitize(item.word),
          sanitize(item.translation),
          sanitize(item.context),
          sanitize(item.part_of_speech || item.category)
        ].filter(p => p !== '');

        const fileName = `${parts.join('_')}.${ext}`;
        const isSelected = selectedWords.has(item.image_url);

        const card = document.createElement('div');
        card.className = `card ${isSelected ? 'selected' : ''}`;
        card.innerHTML = `
          <button onclick="event.stopPropagation(); deleteWord('${item.id}')" style="position: absolute; top: 5px; right: 5px; background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-weight: bold; line-height: 1; z-index: 10;">&times;</button>
          <input type="checkbox" class="checkbox-custom" ${isSelected ? 'checked' : ''}>
          <img src="${item.image_url || 'https://via.placeholder.com/150?text=No+Image'}" alt="${item.word}">
          <div class="card-title">${item.word}</div>
          ${item.translation ? `<div class="card-sub">${item.translation}</div>` : ''}
          <div class="card-tags">
            ${item.context ? `[${item.context}]` : ''} ${item.part_of_speech || item.category ? `(${item.part_of_speech || item.category})` : ''}
          </div>
        `;

        const checkbox = card.querySelector('input');
        
        card.addEventListener('click', (e) => {
          if (e.target !== checkbox) checkbox.checked = !checkbox.checked;
          
          if (checkbox.checked) {
            card.classList.add('selected');
            selectedWords.set(item.image_url, fileName);
          } else {
            card.classList.remove('selected');
            selectedWords.delete(item.image_url);
          }
          actualizarBotonZip();
        });

        grid.appendChild(card);
      });
    }

    function filterByLetter(letter, btnElement) {
      currentLetterFilter = letter;
      document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      renderGrid();
    }

    document.getElementById('searchInput').addEventListener('input', renderGrid);
    document.getElementById('categoryFilter').addEventListener('change', renderGrid);

    function actualizarBotonZip() {
      const btn = document.getElementById('downloadZipBtn');
      btn.textContent = `Descargar ZIP (${selectedWords.size})`;
      btn.disabled = selectedWords.size === 0;
    }

    document.getElementById('selectAllBtn').addEventListener('click', () => {
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        const checkbox = card.querySelector('input');
        if (!checkbox.checked) {
          card.click();
        }
      });
    });

    // Subir nueva palabra
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const wordInput = document.getElementById('word').value.trim();
      const isDuplicate = allWords.some(item => item.word.toLowerCase() === wordInput.toLowerCase());

      if (isDuplicate) {
        alert(`La palabra "${wordInput}" ya existe en el catálogo.`);
        return;
      }

      const formData = new FormData();
      formData.append('word', document.getElementById('word').value);
      formData.append('translation', document.getElementById('translation').value);
      formData.append('context', document.getElementById('context').value);
      formData.append('part_of_speech', document.getElementById('partOfSpeech').value);
      formData.append('image', document.getElementById('image').files[0]);

      const res = await fetch('/api/words-with-image', { method: 'POST', body: formData });
      if (res.ok) {
        document.getElementById('uploadForm').reset();
        cargarPalabras();
      }
    });

    // Generar ZIP
    document.getElementById('downloadZipBtn').addEventListener('click', async () => {
      const zip = new JSZip();
      const btn = document.getElementById('downloadZipBtn');
      btn.textContent = 'Comprimiendo...';

      for (const [url, filename] of selectedWords.entries()) {
        try {
          const response = await fetch(url);
          const blob = await response.blob();
          zip.file(filename, blob);
        } catch (err) {
          console.error('Error al descargar:', url, err);
        }
      }

      zip.generateAsync({ type: 'blob' }).then((content) => {
        saveAs(content, `vocabulario_seleccionado.zip`);
        actualizarBotonZip();
      });
    });

    async function deleteWord(id) {
      if (!confirm('¿Seguro que deseas eliminar esta palabra?')) return;

      try {
        const res = await fetch(`/api/words/${id}`, { method: 'DELETE' });
        if (res.ok) {
          cargarPalabras();
        } else {
          alert('Error al eliminar la palabra');
        }
      } catch (err) {
        console.error('Error al borrar:', err);
      }
    }

    // Inicializar todo
    initAlphabet();
    cargarPalabras();
  </script>
</body>
</html>
